<!doctype html>
<!-- 生成物：由 _inline.py 从 mine.src.html + dg-time.js + mine.js 合成，别手改这份；改完源文件重跑 python _inline.py -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage posted requests</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, "Microsoft YaHei", sans-serif; background: #070C14; color: #E9F1F9; line-height: 1.6; }
  .banner { background: #E9A23B; color: #fff; text-align: center; padding: 6px 12px; font-size: 13px; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 16px; }
  .back { display: inline-block; font-size: 13px; color: #A3B5C9; text-decoration: none; margin-bottom: 12px; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 6px; }
  .sub { font-size: 13px; color: #869AB0; margin: 4px 0 18px; }
  h2 { font-size: 14px; font-weight: 500; color: #A3B5C9; margin: 26px 0 8px; }
  label { display: block; font-size: 13px; color: #A3B5C9; margin-bottom: 6px; }
  textarea { display: block; width: 100%; min-height: 110px; padding: 10px 12px; font: inherit; font-size: 12px; color: #E9F1F9; background: #0D1622; border: 1px solid #22303F; border-radius: 8px; resize: vertical; }
  textarea:focus { outline: none; border-color: #E9F1F9; }
  .keys { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  /* 小键只比大键小一档，不做成「苍蝇键」：13px 字、9/16 内边距，指头点得住。 */
  .mini { font: inherit; font-size: 13px; padding: 9px 16px; background: #0D1622; border: 1px solid #22303F; border-radius: 8px; cursor: pointer; }
  .mini.primary { background: rgba(90, 169, 240, .12); border-color: #2B6DA8; }
  /* 与发布页「发布」键同一套尺寸：整栏宽、15px 内边距、16px 字、12px 圆角。 */
  .btn { display: block; width: 100%; padding: 15px 18px; font: inherit; font-size: 16px; font-weight: 500; color: #E9F1F9; background: #0D1622; border: 1px solid #22303F; border-radius: 12px; cursor: pointer; text-align: left; text-decoration: none; }
  .btn:hover { border-color: #E9F1F9; }
  .btn.primary { background: rgba(90, 169, 240, .12); border-color: #2B6DA8; }
  .btn[disabled] { opacity: .5; cursor: default; }
  /* 禁用态：灰掉但仍占位。 */
  .mini[disabled] { opacity: .5; cursor: default; }
  .btn.center { text-align: center; }
  .stage { background: #0D1622; border: 1px solid #1A2635; border-radius: 12px; padding: 12px 16px; margin-top: 14px; font-size: 13px; color: #A3B5C9; }
  .stage p { margin: 0 0 10px; }
  .stage p:last-child { margin: 0; }
  .stage b { color: #E9F1F9; font-weight: 500; }
  .stage code { font-size: 12px; color: #5AA9F0; background: #0F1B29; padding: 1px 5px; border-radius: 3px; }
  .stage .keys { flex-direction: column; gap: 8px; }
  .stage .demo { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #1A2635; font-size: 12px; color: #869AB0; }
  .stage .demo .keys { margin-top: 10px; flex-direction: row; }
  .stage .demo .mini { color: #869AB0; }
  .msg { margin-top: 12px; font-size: 13px; border-radius: 10px; padding: 10px 14px; background: #16222F; border: 1px solid #22303F; color: #C2D0DE; }
  .msg.bad { background: rgba(255, 138, 138, .12); border-color: #7A3B3B; color: #FFA8A8; }
  .msg.ok { background: rgba(125, 212, 138, .12); border-color: #35603C; color: #7DD48A; }
  .who { background: #0D1622; border: 1px solid #1A2635; border-radius: 12px; padding: 8px 16px 14px; margin-top: 14px; }
  .who .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 8px 0 0; font-size: 12px; color: #A3B5C9; }
  .who code, .mine code { font-size: 13px; color: #5AA9F0; background: #0F1B29; padding: 1px 5px; border-radius: 3px; word-break: break-all; }
  /* 高度按「整行」取：当前行高 53px × 7 行 ≈ 380，留 6px 余量。
     切在行边界上，末行不会只露半截（半截看着像「又被挤掉了」）；再多就滚动。 */
  .mine { background: #0D1622; border: 1px solid #1A2635; border-radius: 12px; padding: 2px 16px; max-height: 386px; overflow-y: auto; }
  .mine .empty { margin: 12px 0; font-size: 13px; color: #869AB0; }
  /* 列表为空时的占位框：先把「这里是一个列表窗口」画出来，位置和高度先占住。 */
  .slot { display: flex; align-items: center; justify-content: center; min-height: 132px; margin: 14px 0; border: 1px dashed #22303F; border-radius: 10px; background: #111C29; font-size: 13px; color: #7E8FA4; }
  .mine .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; border-top: 1px solid #141F2C; padding: 9px 0; font-size: 13px; color: #A3B5C9; }
  .mine .row:first-child { border-top: 0; }
  .mine .row b { font-weight: 500; color: #E9F1F9; }
  .mine .row a { color: #5AA9F0; text-decoration: none; }
  /* 每行右侧那枚「管理」：小键，和行内的编号/日期/状态分开，一眼看出是列表的一行。 */
  .mine .row button.op { margin-left: auto; font: inherit; font-size: 13px; padding: 6px 14px; color: #E9F1F9; background: #0D1622; border: 1px solid #22303F; border-radius: 8px; cursor: pointer; }
  .mine .row button.op:hover { border-color: #E9F1F9; }
  /* 选中的那一行：状态栏在下面，万一没看到下面，至少这一行有变化。 */
  .mine .row.sel { background: #0E1D2C; }
  .sev { color: #869AB0; }
  /* 状态标签：六种状态各一色，扫一眼就知道这一行走到哪一步。
     色只用来分档，不表示好坏——「已撤回」「已过期」也只是一个终局，不是错误。 */
  .tag { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; line-height: 18px; border: 1px solid #22303F; white-space: nowrap; }
  .tag.s-open { color: #5AA9F0; background: rgba(90, 169, 240, .12); border-color: #2B6DA8; }
  .tag.s-claimed { color: #3FC7B0; background: rgba(63, 199, 176, .12); border-color: #2A7F72; }
  .tag.s-delivered { color: #E3A961; background: rgba(233, 162, 59, .12); border-color: #6A4A1D; }
  .tag.s-closed { color: #7DD48A; background: rgba(125, 212, 138, .12); border-color: #35603C; }
  .tag.s-withdrawn { color: #869AB0; background: #131E2B; border-color: #22303F; }
  .tag.s-expired { color: #FF8A8A; background: rgba(255, 138, 138, .12); border-color: #7A3B3B; }
  footer { border-top: 1px solid #1A2635; margin-top: 28px; padding: 14px 0 6px; text-align: center; font-size: 12px; color: #869AB0; }
  footer a { color: #A3B5C9; text-decoration: none; margin: 0 8px; }
/* ==== DG-UI BEGIN ==== */
/* 整站单源样式。由 _theme.py 写进每一页 <style> 的末尾。
   页内同名规则会被这一段覆盖（同选择器、后者胜）——改样式改这里，别改页内副本。
   三档按键：.btn 一栏一个主动作 / .mini .op 行内小键 / .go 卡片里那一个入口。
   两个断点：≤560px 触控（按键不低于 44px）、≥900px 桌面留白。

   2026-11-27 换深色：色值与 site/home.html 的 --d-* 一一对应，首页与内页同一套底。
   为什么不把 --blue 也换成品牌青绿：状态标签靠色相区分（开放=蓝、已认领=青、
   已交付=琥珀、已关闭=绿、已过期=红），两个状态同色就白标了。故青绿只用于
   主动作（.btn.primary、.go、焦点环），蓝降为「信息与链接」的语义色。 */

:root {
  --bg: #070C14; --paper: #0D1622; --surface2: #131E2C;
  --ink: #E9F1F9; --sub: #A3B5C9; --muted: #869AB0; --faint: #6E7E92;
  --line: #22303F; --hair: #1A2635; --hair2: #141F2C;
  --blue: #5AA9F0; --blue-h: #7CBBF5; --blue-a: #8CC6F5; --blue-l: #2B6DA8; --blue-bg: rgba(90, 169, 240, .12);
  --brand: #2ED9B8; --brand-soft: rgba(46, 217, 184, .12); --brand-line: rgba(46, 217, 184, .34);
  --on-brand: #03130F;
  --amber: #E9A23B;
  --green: #7DD48A;
  --red: #FF8A8A;
  --r-lg: 12px; --r-sm: 8px;
  --press: 0 0 0 3px rgba(46, 217, 184, .22);
}

html { -webkit-text-size-adjust: 100%; }

/* 页内 body 规则各自写过一遍（米色底、深灰字），这一段用 html body 两层的
   选择器压过它们——不靠 !important，也不依赖书写顺序。 */
html body {
  background: var(--bg); color: var(--ink);
  font-family: ui-sans-serif, -apple-system, "Segoe UI Variable Text", "Segoe UI",
               "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  line-height: 1.65;
}

/* ---- 基础链接色：这条以前一直缺 ---- */
/* 米色时代没人发现，是因为浏览器默认的 #0000EE 在白底上还算「链接蓝」（约 7:1）；
   换深色后它成了整站最糟的一处——#0000EE 压在 #131E2C 上只有 1.79:1，等于看不见。
   大多数页面的链接有自己的类，但裸 <a> 一直靠默认值，故在这里兜住。
   带类的规则（.go/.lang/.tag…）优先级更高，不会被这条压掉。 */
a { color: var(--blue); }
a:hover { color: var(--blue-h); }

/* ---- 主键：一栏一个，50px 高 ---- */
.btn {
  display: block; width: 100%; min-height: 50px; margin: 0;
  padding: 13px 18px;
  font: inherit; font-size: 16px; font-weight: 500; line-height: 1.4;
  color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: var(--r-lg);
  text-align: center; text-decoration: none; cursor: pointer;
  transition: background-color .15s, border-color .15s, color .15s, box-shadow .15s;
}
.btn:hover { border-color: var(--faint); background: var(--surface2); }
.btn:active { background: #16222F; }
.btn.primary {
  color: var(--on-brand); background: var(--brand); border-color: var(--brand);
  box-shadow: 0 1px 2px rgba(46, 217, 184, .18);
}
.btn.primary:hover { background: #46E4C6; border-color: #46E4C6; box-shadow: 0 2px 10px rgba(46, 217, 184, .26); }
.btn.primary:active { background: #24C4A6; border-color: #24C4A6; box-shadow: none; }
.btn[disabled], .btn[aria-disabled="true"] {
  opacity: .45; cursor: not-allowed;
  background: #101A26; border-color: var(--hair); color: var(--muted); box-shadow: none;
}
.btn.center { text-align: center; }
.btn small { display: block; font-size: 12px; font-weight: 400; color: var(--sub); margin-top: 3px; }
.btn.primary small { color: rgba(3, 19, 15, .72); }
/* 只能由本人按、且一按就收不回来的那一类（撤回、拒收）：红字深底，鼠标移上去才转实。
   不做成实心红——那是「马上要发生」，而这几个键按下去之前还有一次确认。 */
.btn.danger { color: var(--red); background: var(--paper); border-color: rgba(255, 138, 138, .34); }
.btn.danger:hover { background: rgba(255, 138, 138, .10); border-color: var(--red); }
.btn.danger:active { background: rgba(255, 138, 138, .16); border-color: var(--red); }

/* ---- 行内小键 ---- */
.mini, .op {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 38px; margin: 0; padding: 8px 14px;
  font: inherit; font-size: 13px; line-height: 1.3;
  color: var(--ink); background: var(--paper);
  border: 1px solid var(--line); border-radius: var(--r-sm);
  text-decoration: none; cursor: pointer;
  transition: background-color .15s, border-color .15s;
}
.mini:hover, .op:hover { border-color: var(--faint); background: var(--surface2); }
.mini:active, .op:active { background: #16222F; }
.mini.primary { color: var(--brand); background: var(--brand-soft); border-color: var(--brand-line); }
.mini.primary:hover { background: rgba(46, 217, 184, .18); border-color: var(--brand); }
.mini[disabled], .op[disabled] { opacity: .45; cursor: not-allowed; background: var(--paper); border-color: var(--hair); }

/* ---- 卡片里那一个入口（「打开」「去交付」「继续交付」） ---- */
.go {
  display: inline-flex; align-items: center; justify-content: center;
  min-height: 38px; margin: 0; padding: 6px 14px;
  font: inherit; font-size: 13px; line-height: 1.3;
  color: var(--brand); background: var(--paper);
  border: 1px solid var(--line); border-radius: var(--r-sm);
  text-decoration: none; cursor: pointer;
  transition: background-color .15s, border-color .15s;
}
.go:hover { border-color: var(--brand); background: var(--brand-soft); }
.go:active { background: rgba(46, 217, 184, .18); }
.go[disabled] { color: var(--faint); border-color: var(--hair); background: var(--paper); cursor: not-allowed; }

/* ---- 导航卡：大厅的门、接任务的三张、接入与查账的条目 ---- */
.dcard, .door, .linkcard {
  display: block; margin-bottom: 10px; padding: 15px 17px;
  background: var(--paper); border: 1px solid var(--line); border-radius: var(--r-lg);
  color: inherit; text-decoration: none;
  transition: border-color .15s, background-color .15s, box-shadow .15s;
}
.dcard:hover, .door:hover, .linkcard:hover { border-color: var(--faint); box-shadow: 0 2px 12px rgba(0, 0, 0, .45); }
.dcard:active, .door:active, .linkcard:active { background: var(--surface2); box-shadow: none; }
/* 有底色的那几张（发布/浏览/已接、大厅的「热门门」）把描边换成同色系的亮一号，
   否则一 hover 就变成灰边，看着像掉了色。 */
.dcard.pub:hover { border-color: var(--blue); }
.dcard.browse:hover, .door.hot:hover { border-color: #E8926E; }
.dcard.taken:hover { border-color: var(--green); }
.dcard b, .door b, .linkcard b { font-size: 15px; font-weight: 500; }
/* 导航卡右上角那枚「↗」是说明，不是第二个按键：退回成纯文字。 */
.dcard .go, .door .go, .linkcard .go {
  float: right; min-height: 0; padding: 0; margin-left: 10px;
  /* 那枚「↗」在暖色块上只有 4.35:1（--muted 压在橙色半透明底上），提一档到 --sub */
  font-size: 12px; color: var(--sub);
  background: none; border: 0; border-radius: 0;
}
.dcard .go:hover, .door .go:hover, .linkcard .go:hover { background: none; color: var(--sub); }

/* 选中的那一档整块跟着变色：只靠一个小圆点，手机上不容易看出选了哪个。
   选择器要带上 .card.form，否则压不过页内 `.card.form .way`（三个类）。 */
.card.form .way:has(input:checked) { border-color: var(--brand-line); background: var(--brand-soft); }
.card.form .way:has(input:focus-visible) { outline: 2px solid var(--brand-line); outline-offset: 2px; }

/* ---- 顶部公示条：琥珀色。深色底上不能再用深琥珀实心配白字（对比不到 2:1），
   改成同色系的半透明底 + 亮琥珀字，仍是「一条警示」的份量。 */
.banner { background: rgba(233, 162, 59, .14); color: #F0C070; border-bottom: 1px solid rgba(233, 162, 59, .30); }

/* ---- 语言切换：每页最上面一行，靠右 ---- */
/* 为什么单独占一行、而不是塞进 .head 或 .back：这两处每页长得都不一样
   （大厅是「站名 + 一句话」，内页是「← 回大厅」，账本页是「← 返回查账与下载」），
   塞进去要一页一页调对齐，改一次十几处。单独一行就只有一个位置要维护。
   不做 position:fixed：它要盖在内容上，滚起来还挡字，而这一格只需要「一眼看见」。 */
/* 深色下用青绿半透明底、青绿字：白底小胶囊在深底上会亮得像主键，喧宾夺主。
   也不做成实心青绿——那是主键（.btn.primary）的份量，语言切换是次要动作。 */
.langrow { display: flex; justify-content: flex-end; margin: -4px 0 6px; }
.lang {
  display: inline-flex; align-items: center; min-height: 30px; padding: 4px 12px;
  font-size: 12px; line-height: 1; color: var(--brand); background: var(--brand-soft);
  border: 1px solid var(--brand-line); border-radius: 999px; text-decoration: none;
}
.lang:hover { border-color: var(--brand); background: rgba(46, 217, 184, .18); }

/* ---- 访问量：一行字。它是次数，不是指标 ---- */
/* 不做卡片、不做分页分布、不做图表——口径与 app.py 的 Visits 类一致：
   只回答「首页被打开过多少次」。数字用等宽 + tabular-nums，位数变了不跳。
   `[hidden]` 要显式压一下：下面 .visits 设了 margin，否则取不到数时那条
   空行仍然占位，页脚会莫名其妙地偏低。 */
.visits { margin: 2rem 0 0; text-align: center; font-size: 13px; color: var(--muted); letter-spacing: .02em; }
.visits[hidden] { display: none; }
.visits b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* ---- 行内代码：页内写的是「深底浅字」的徽章，换深色后底色与页面同层，
   会糊成一片；统一抬到 surface2，字回到 ink。 ---- */
code { background: var(--surface2); color: var(--ink); border-color: var(--line); }

/* ---- 键盘可见的焦点环：鼠标点击不出现，Tab 一定出现 ---- */
a:focus-visible, button:focus-visible, summary:focus-visible,
input:focus-visible, textarea:focus-visible, select:focus-visible {
  outline: 2px solid var(--brand-line); outline-offset: 2px;
}

/* ---- 手机：触控目标不低于 44px，正文不缩到看不清 ---- */
@media (max-width: 560px) {
  .wrap { padding: 14px 14px 26px; }
  h1 { font-size: 19px; }
  h2 { margin-top: 22px; }
  .banner { font-size: 12px; padding: 5px 10px; }
  .back { min-height: 44px; margin-bottom: 6px; }
  /* 语言切换和 .back 一样是「点一下就走」的链接，手机上同给 44px：这一格在右上角，
     指头落点比视线更难对准。 */
  .lang { min-height: 44px; padding: 4px 16px; font-size: 14px; }
  .btn { font-size: 16px; min-height: 52px; padding: 14px 16px; }
  .mini, .op { min-height: 44px; padding: 10px 16px; font-size: 14px; }
  .go { min-height: 44px; padding: 10px 16px; font-size: 14px; }
  /* 页内 `.req .go`、`.mine .row button.op` 比上面两条更具体，字号得单独抬一档。 */
  .req .go, .mine .row button.op { font-size: 14px; }
  .bar .mini { font-size: 14px; }
  .dcard .go, .door .go, .linkcard .go { min-height: 0; padding: 0; font-size: 12px; }
  /* 卡片底栏：手机上一行放不下「期限 + 按键」，就让按键独占一行，整行可点。 */
  .req .foot .go { width: 100%; }
  /* iOS 在 <16px 的输入框上会强制放大页面：这一处必须压过页内的 14px。 */
  input, textarea, select { font-size: 16px !important; }
}

/* ---- 桌面：一栏还是那一栏，留白多一点，别把内容拉成一条长线 ---- */
@media (min-width: 900px) {
  .wrap { max-width: 680px; padding: 24px 20px 40px; }
  .btn { min-height: 48px; }
}
/* ==== DG-UI END ==== */
</style>
</head>
<body>
<div class="wrap">
  <div class="langrow"><a class="lang" href="/mine">中文</a></div>

  <a class="back" href="/en/post">← Back to posting</a>
  <h1>Manage posted requests</h1>
  <p class="sub">Paste the whole .json from “Export backup”; it is how you get your posted requests back on another browser.</p>

  <label for="paste">Key backup contents</label>
  <textarea id="paste" spellcheck="false" placeholder='{"party":"pt_...","pkcs8":"...","pub":"...","made":"..."}'></textarea>
  <div class="keys">
    <button class="mini" id="clip">Paste</button>
    <button class="mini primary" id="load">Load</button>
    <button class="mini" id="restore" hidden>Restore the key to this browser</button>
  </div>
  <div id="msg" class="msg" hidden></div>

  <div id="who" class="who" hidden>
    <div class="row"><span>Id</span><code id="party">…</code></div>
    <div class="row"><span>Fingerprint</span><code id="fp">…</code></div>
  </div>

  <h2>Posted requests</h2>
  <div id="list" class="mine"><div class="slot">No id loaded yet.</div></div>
  <div id="stage" class="stage" hidden></div>

  <footer><p><a href="/en/home">Back to lobby</a>·<a href="mailto:2379731846@qq.com">Only contact address: 2379731846@qq.com</a></p></footer>
</div>
<script>
/* 协议 2.2 的两个时限：认领后 10 天内交付、交付后 10 天内确认。
   一律固定，不随发布时选——发布页表单因此不用多一个字段，条款比对也少一维。

   为什么按「10×24 小时」而不是「第 10 个自然日」：
   服务端比较的是 UTC 时刻，用户看的是本地日期，UTC+8 在傍晚之后跨日——
   按自然日取整会出现「页面说 27 日、服务端 26 日就到期」。按毫秒加，两边指同一个瞬间，
   页面显示时再转本地时区，写出来的日期就是用户以为的那一天。

   起算点一律是服务端写下的那一刻（claimed / delivered 行的 created_at），不用客户端时间：
   客户端时钟偏了，期限就偏了，而这个期限是要判死的。 */
'use strict';
const CLAIM_DELIVERY_DAYS = 10;
const CONFIRM_WINDOW_DAYS = 10;
/* 催告的下限：交付后满 7 天才开放。太早催没有意义——对方可能只是还没看到，
   账上却先落一条「催了也白催」的签名事实。上限不设：过了确认期反而更该催。 */
const REMIND_AFTER_DAYS = 7;
const DAY_MS = 86400000;

/* iso → 到期时刻（毫秒）。取不到时间就返回 null，让调用方如实显示「取不到」，不猜。 */
function deadlineMs(iso, days) {
  const t = Date.parse(String(iso || ''));
  return Number.isFinite(t) ? t + days * DAY_MS : null;
}

/* 「11 月 27 日 14:20」。写到分钟是必要的：只写日期会让人以为当天 23:59 前都行。 */
function fmtDeadline(ms) {
  if (!Number.isFinite(ms)) return '';
  const d = new Date(ms);
  const p = (n) => String(n).padStart(2, '0');
  return (d.getMonth() + 1) + '/' + d.getDate() + '/' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* 从某个时刻到现在过了几天（向下取整）。用来算「等确认 N 天」，不参与判死。 */
function daysSince(iso, nowMs) {
  const t = Date.parse(String(iso || ''));
  if (!Number.isFinite(t)) return null;
  return Math.max(0, Math.floor(((nowMs || Date.now()) - t) / DAY_MS));
}

</script>
<script>
/* 已发布的需求管理
   三件事：认人（编号 + 指纹）、认需求发布（按 requested_by 查）、换机器（把备份写回本机）。
   不复制状态：需求发布的状态以服务端为准，本地清单只补「服务端已经看不见」的那部分
   （终态 90 天后退出公开视图，那种需求发布只剩本地这一份记录）。 */
'use strict';

const $ = (s) => document.querySelector(s);
const KEY_STORE = 'dg_post_key_v1';
const MINE_STORE = 'dg_post_mine_v1';
const MINE_MAX = 200;
const REAL_HOST = /(^|\.)drawcommons\.org$/;
const FILE_MODE = location.protocol === 'file:' || !REAL_HOST.test(location.hostname);
const STATE_CN = { open: 'Open', claimed: 'Claimed', delivered: 'Delivered',
                   closed: 'Closed', withdrawn: 'Withdrawn', expired: 'Expired' };

const enc = new TextEncoder();
const cat = (...a) => { const n = a.reduce((s, x) => s + x.length, 0); const o = new Uint8Array(n); let p = 0; for (const x of a) { o.set(x, p); p += x.length; } return o; };
const u32 = (n) => { const b = new Uint8Array(4); new DataView(b.buffer).setUint32(0, n); return b; };
const str = (s) => { const b = typeof s === 'string' ? enc.encode(s) : s; return cat(u32(b.length), b); };
const b64 = (u8) => { let s = ''; const CH = 0x8000; for (let i = 0; i < u8.length; i += CH) s += String.fromCharCode.apply(null, u8.subarray(i, i + CH)); return btoa(s); };
const unb64 = (t) => { const s = atob(t); const o = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) o[i] = s.charCodeAt(i); return o; };
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let cur = null;

/* 预览面板把页面放在沙箱 iframe 里，那里的 localStorage 一碰就抛 SecurityError（不是返回 null）。
   这种情况下退回内存里的一份：页面照样能列出、能点、能改状态，只是刷新即丢。
   先探一次再决定用哪个——探不通就别再碰它，免得每处调用都各自 try 一遍。 */
const store = (() => {
  try {
    const probe = '__dg_probe__';
    localStorage.setItem(probe, '1');
    localStorage.removeItem(probe);
    return {
      real: true,
      get: (k) => localStorage.getItem(k),
      set: (k, v) => localStorage.setItem(k, v),
    };
  } catch {
    const mem = new Map();
    return {
      real: false,
      get: (k) => (mem.has(k) ? mem.get(k) : null),
      set: (k, v) => { mem.set(k, String(v)); },
    };
  }
})();

function msg(html, kind) {
  const m = $('#msg');
  m.hidden = false;
  m.className = 'msg ' + (kind || '');
  m.innerHTML = html;
}
function loadMine() {
  try { const a = JSON.parse(store.get(MINE_STORE) || '[]'); return Array.isArray(a) ? a : []; }
  catch { return []; }
}

/* 备份里 pub 是 32 字节公钥的 base64。指纹与发布页同一个算法：SHA256(ssh-ed25519 的公钥 blob)。
   只粘编号时算不出来——那不是错，是不完整，如实说。 */
async function fpOf(pubB64) {
  try {
    const raw = unb64(pubB64);
    const d = new Uint8Array(await crypto.subtle.digest('SHA-256', cat(str('ssh-ed25519'), str(raw))));
    return 'SHA256:' + b64(d).replace(/=+$/, '');
  } catch { return 'The backup has no usable public key, so no fingerprint can be computed'; }
}

/* 两种粘贴都收：整段 .json（有私钥，能恢复），或者只粘编号（只能查）。
   认不出就抛，不猜。 */
function parseBackup(text) {
  const t = String(text || '').trim();
  if (!t) return null;
  try {
    const o = JSON.parse(t);
    if (o && typeof o.party === 'string') {
      if (!/^pt_[0-9a-z]{8,32}$/.test(o.party)) throw new Error('Bad id format: it should start with pt_ followed by 8–32 lowercase letters or digits.');
      return { party: o.party, pkcs8: o.pkcs8 || '', pub: o.pub || '', made: o.made || '' };
    }
  } catch (e) {
    if (e instanceof SyntaxError) { /* 不是 JSON，往下试纯编号 */ }
    else throw e;
  }
  const m = t.match(/pt_[0-9a-z]{8,32}/);
  return m ? { party: m[0], pkcs8: '', pub: '', made: '' } : null;
}

/* 状态统一画成一枚色标：列表行与状态栏共用，同一个状态在哪儿都是同一个颜色。
   认不出的状态名原样显示、不加色——不替服务端猜。 */
const tagOf = (s) => {
  const cls = STATE_CN[s] ? ' s-' + s : '';
  return '<span class="tag' + cls + '">' + esc(STATE_CN[s] || s || '—') + '</span>';
};

function rowHtml(x) {
  const at = String(x.at || '').slice(0, 10);
  const open = FILE_MODE ? '' : ' <a href="https://drawcommons.org/r/' + encodeURIComponent(x.id) + '">打开</a>';
  const sel = stage && stage.id === x.id ? ' sel' : '';
  /* 「管理」用 button 而不是 <a href="#">：锚点在没有脚本或脚本出错时会跳一下空锚，
     看起来就是「点了没反应」；button 不会，且点它等于点这一行。 */
  return '<div class="row' + sel + '" data-id="' + esc(x.id) + '"><code>' + esc(x.id) + '</code>' +
         (at ? ' <span class="sev">' + esc(at) + '</span>' : '') +
         ' · ' + tagOf(x.state) + open +
         ' <button type="button" class="op" data-manage="' + esc(x.id) + '">Manage</button></div>';
}

/* 空态一律画成同一个占位框：先让人看见「这里是一个列表窗口」，别只剩一行灰字。 */
const emptySlot = (text) => '<div class="slot">' + esc(text) + '</div>';

/* 终态沉底（与「已接的需求」那一页同一档）。已结 / 已撤回 / 已过期仍然留在列表里——
   历史要能查，但别再占前排。同一档内仍按发布时刻倒序：刚结的单排在旧的前面。 */
const SETTLED = { closed: 1, withdrawn: 1, expired: 1 };
const byTimeDesc = (a, b) => String(b.at).localeCompare(String(a.at));
const settledLast = (rows) => rows.slice().sort((a, b) =>
  ((SETTLED[a.state] ? 1 : 0) - (SETTLED[b.state] ? 1 : 0)) || byTimeDesc(a, b));

async function renderList() {
  const el = $('#list');
  if (!cur) {
    /* 还没载入编号也要有列表：本机记下的就是这个浏览器的全部，
       不该因为没粘钥匙而空着——那样看着像「这一页没有列表」。 */
    rowsCache = settledLast(loadMine());
    el.innerHTML = rowsCache.length
      ? rowsCache.map(rowHtml).join('')
      : emptySlot('No id loaded yet.');
    /* 没有编号也要有状态栏：这一页管的始终是本机记下的那几条。 */
    ensureStage();
    syncSel();
    renderStage();
    return;
  }
  const local = loadMine().filter((x) => !x.by || x.by === cur.party);
  let rows = local;
  let note = '';
  if (FILE_MODE) {
    note = 'Preview has no server, so only requests recorded in this browser show here; the live site queries the server by id.';
  } else {
    try {
      const r = await fetch('/api/v1/requests?limit=' + MINE_MAX, { headers: { Accept: 'application/json' } });
      const j = await r.json();
      const byId = new Map(local.map((x) => [x.id, x]));
      for (const it of (j.items || [])) {
        if (it.requested_by !== cur.party) continue;
        /* 服务端状态覆盖本地：本地记的是「我发过什么」，状态是服务端的事实。
           claimer_email / reminders 目前读口还没有这两列（v2.2 待加），
           有就带上，没有就不带——绝不拿空串冒充「他没留邮箱」。 */
        byId.set(it.request_id, {
          ...(byId.get(it.request_id) || {}),
          id: it.request_id, at: it.created_at || '', state: it.state,
          ...(it.claimer_email ? { claimer_email: it.claimer_email } : {}),
          ...(Number(it.reminders) ? { reminders: it.reminders, last_remind_at: it.last_remind_at || '' } : {}),
          ...(it.rejected ? { rejected: true } : {}),
        });
      }
      rows = [...byId.values()];
    } catch { note = 'Could not reach the server; showing what this browser recorded for now.'; }
  }
  rows = settledLast(rows);
  rowsCache = rows;
  el.innerHTML = rows.length
    ? rows.map(rowHtml).join('') + (note ? '<div class="row sev">' + note + '</div>' : '')
    : emptySlot('No requests posted under this id yet.' + (note ? ' ' + note : ''));
  /* 状态栏跟着「选中的那张」；没选中、或选中的已经不在列表里，就落到第一张。
     跟上面没有编号那一路同一套逻辑：一页只有一种「谁是当前这张」的答案。 */
  ensureStage();
  syncSel();
  renderStage();
}

/* ---------- 现在的状态（整栏从发布页搬过来） ----------
   七项终局：open / claimed / delivered / closed / withdrawn / expired，
   外加「认领后退回」回到 open。键跟着**当前状态**走，不跟着「这次发布曾经到过哪」走：
   一条已过期的需求发布不会再长出撤回键。
   认领、交付、到期是另一端与时钟的事，发布方在这一侧按不了，只能替对面按（标「演示：」）。
   催告是**接单方**的动作（他在「已接的需求」那一页按），这一侧不摆催告键——
   发布方在这里只有「确认完成」与「拒收」两件事。
   预览里所有键只改这一页和本地清单，不发请求；真站的撤回/确认要签名，尚未接。 */
const KEYS = {
  open: [['Withdraw this request', 'withdraw', 'danger']],
  claimed: [['Withdraw this request', 'withdraw', 'danger']],
  delivered: [['Confirm completion', 'confirm', 'primary'], ['Reject this delivery', 'reject', 'danger']],
  closed: [], withdrawn: [], expired: [],
};
const DEMO_KEYS = {
  open: [['Demo: someone claims', 'claim'], ['Demo: it expires', 'expire']],
  claimed: [['Demo: it is delivered', 'deliver'], ['Demo: the claimer returns it', 'back']],
  delivered: [], closed: [], withdrawn: [], expired: [],
};
let rowsCache = [];
let stage = null;   /* { id, state, rejected, dv, reminded } */

/* 从清单行造一个「正在看的状态」。dv 是交付那一刻，用来算等确认几天；
   没有就当取不到，不编日期。
   mail / reminds / lastRemind 是单上的事实：认领方留的地址、催过几次、最近哪一天催的。
   取不到就留空，页面那边整行不出现。 */
function mkStage(r) {
  return {
    id: r.id, state: r.state || 'open', rejected: !!r.rejected, dv: r.dv || '',
    mail: r.claimer_email || '',
    reminds: Number(r.reminders || 0) || 0,
    lastRemind: r.last_remind_at || '',
  };
}

/* 「11 月 16 日」只要月日：催告是这一周内的事，年份是噪声。 */
const mdOf = (iso) => {
  const t = String(iso || '').slice(5, 10);
  return /^\d\d-\d\d$/.test(t) ? t : '';
};

function renderStage() {
  const el = $('#stage');
  if (!el) return;
  if (!stage) { el.hidden = true; return; }
  const s = stage.state;
  const big = (k) => '<button class="btn' + (k[2] ? ' ' + k[2] : '') + '" data-act="' + k[1] + '">' + k[0] + '</button>';
  const small = (k) => '<button class="mini" data-act="' + k[1] + '">' + k[0] + '</button>';
  /* 拒收过就不再给「拒收」——一单一条，不可改（DGB_LED_012/013）；
     「确认完成」仍在：确认与拒收是两层并列断言，签过拒收不等于放弃确认。 */
  const keys = (KEYS[s] || []).filter((k) => !(k[1] === 'reject' && stage.rejected));
  const demo = (DEMO_KEYS[s] || []).slice();

  /* 等确认那行只写「对面交付了多久、还没结」——发布方在这一页能做的只有确认或拒收，
     催告是接单方那边的动作（他在「已接的需求」页按），这一侧不替他写「该催了」。 */
  const waited = s === 'delivered' && stage.dv ? daysSince(stage.dv) : null;
  const dline = waited === null ? ''
    : 'The claimer delivered' + waited + 'days ago; waiting for your confirmation' +
      (waited >= CONFIRM_WINDOW_DAYS
        ? '(past the' + CONFIRM_WINDOW_DAYS + '-day confirmation window; only you can close this one).'
        : '(confirmation window' + CONFIRM_WINDOW_DAYS + 'days).');

  /* 认领方留的地址：只有这一单被认领之后才可能有，且只在发布方这一侧出现。
     没有就整行不出现——「他没留」不是页面该替他说的话。 */
  const mailLine = (s === 'claimed' || s === 'delivered' || s === 'closed') && stage.mail
    ? '<p>Claimer’s address <code>' + esc(stage.mail) + '</code></p>' : '';
  /* 催告是认领方按的，记在单上。这一侧只看得到次数与最近一次，没有已读、也没有回复。 */
  const rLine = s === 'delivered' && stage.reminds
    ? '<p>The claimer has sent <b>' + stage.reminds + '</b> reminders' +
      (mdOf(stage.lastRemind) ? '(most recent' + mdOf(stage.lastRemind) + '）' : '') + '。</p>' : '';
  /* 拒收不结单：单子仍停在「交付中」，而交付中只有一个出口——发布方确认。
     这句必须写出来，否则拒收看起来像把单子结束了。 */
  const rjLine = s === 'delivered' && stage.rejected
    ? '<p>Rejecting does not close the request: it stays “Delivered”, and the only way to close it is “Confirm completion”.</p>' : '';

  el.innerHTML =
    '<p>Request id <code>' + esc(stage.id) + '</code> · current state:' + tagOf(s) +
      (stage.rejected ? '· you rejected this delivery' : '') + '</p>' +
    (dline ? '<p>' + dline + '</p>' : '') +
    mailLine + rLine + rjLine +
    (keys.length ? '<div class="keys">' + keys.map(big).join('') + '</div>' : '') +
    (demo.length
      ? '<div class="demo">Preview has no other side; these buttons stand in for the counterparty and the clock:<div class="keys">' + demo.map(small).join('') + '</div></div>'
      : '');
  el.hidden = false;
}

/* 选中哪一行，只有一处改：state 变动后的重画也得让底色跟着走，否则高亮会留在旧行上。 */
function syncSel() {
  document.querySelectorAll('#list .row[data-id]').forEach((row) => {
    row.classList.toggle('sel', !!stage && row.dataset.id === stage.id);
  });
}

/* 状态栏默认就要有主：列表里只要有行，就选中第一行。
   否则这一整栏要等用户点了「管理」才出现，看着像没搬过来。 */
function ensureStage() {
  if (!rowsCache.length) { stage = null; return; }
  if (!stage || !rowsCache.some((r) => r.id === stage.id)) {
    stage = mkStage(rowsCache[0]);
  }
}

function selectStage(id, scroll) {
  const r = rowsCache.find((x) => x.id === id);
  if (!r) return;
  stage = mkStage(r);
  /* 行上给个选中的底色：状态栏在列表下面，万一看不到下面，至少这一行会变。 */
  syncSel();
  renderStage();
  if (scroll && $('#stage').scrollIntoView) $('#stage').scrollIntoView({ block: 'center' });
}

/* 状态变了就写回本地清单：这一页刷新后还要认得；另外让列表那行的字跟着改。 */
function saveMineState(id, state) {
  const row = rowsCache.find((r) => r.id === id);
  if (row) row.state = state;
  const list = loadMine();
  const i = list.findIndex((r) => r.id === id);
  if (i >= 0) list[i].state = state;
  else list.unshift({ id, at: new Date().toISOString(), state, by: cur ? cur.party : '' });
  try { store.set(MINE_STORE, JSON.stringify(list.slice(0, MINE_MAX))); } catch { /* 写不进就只改这一屏 */ }
  renderList();
}

/* 拒收不改状态，但它是单上的一条事实：换一行再回来，那一行还得是「你已拒收」。
   只补字段、不动 state，所以不复用 saveMineState（那个会连带重画整张列表）。 */
function saveMineFlag(id, patch) {
  const row = rowsCache.find((r) => r.id === id);
  if (row) Object.assign(row, patch);
  const list = loadMine();
  const i = list.findIndex((r) => r.id === id);
  if (i >= 0) Object.assign(list[i], patch);
  try { store.set(MINE_STORE, JSON.stringify(list.slice(0, MINE_MAX))); } catch { /* 写不进就只改这一屏 */ }
}

function act(a) {
  if (!stage) return;
  const s = stage.state;
  const before = stage.state;
  if (a === 'withdraw' && (s === 'open' || s === 'claimed')) stage.state = 'withdrawn';
  else if (a === 'confirm' && s === 'delivered') stage.state = 'closed';
  else if (a === 'reject' && s === 'delivered') { stage.rejected = true; saveMineFlag(stage.id, { rejected: true }); }
  else if (a === 'claim' && s === 'open') stage.state = 'claimed';
  else if (a === 'back' && s === 'claimed') stage.state = 'open';
  else if (a === 'deliver' && s === 'claimed') {
    stage.state = 'delivered';
    stage.dv = new Date().toISOString();   /* 交付那一刻起算 10 天确认期 */
  }
  else if (a === 'expire' && s === 'open') stage.state = 'expired';
  renderStage();
  /* 按状态有没有变来决定写不写：拒收不改状态，本来就不该动清单；
     但「拒收过之后再确认」是真的改了状态，不能被同一个标记挡住（否则列表还停在交付中）。 */
  if (stage.state !== before) saveMineState(stage.id, stage.state);
}

async function use(o) {
  if (!o) { msg('Cannot read this: paste the whole .json backup, or just the id (starting with pt_).', 'bad'); return; }
  cur = o;
  $('#who').hidden = false;
  $('#party').textContent = o.party;
  $('#fp').textContent = o.pub ? await fpOf(o.pub) : 'The backup has no public key, so no fingerprint can be computed';
  let localParty = '';
  try { localParty = JSON.parse(store.get(KEY_STORE) || '{}').party || ''; } catch { /* 没有就没有 */ }
  /* 只在「这份备份能恢复」且「本机不是这个编号」时给恢复键；同一个人点它没有意义。 */
  $('#restore').hidden = !(o.pkcs8 && o.pub) || localParty === o.party;
  await renderList();
}

/* 点「管理」或点整行都选中；「打开」这类真链接放行，不拦。 */
$('#list').addEventListener('click', (e) => {
  const b = e.target.closest('[data-manage]');
  if (b) { e.preventDefault(); selectStage(b.dataset.manage, true); return; }
  if (e.target.closest('a')) return;
  const row = e.target.closest('.row[data-id]');
  if (row) selectStage(row.dataset.id, true);
});

$('#stage').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-act]');
  if (b) act(b.dataset.act);
});

$('#clip').addEventListener('click', async () => {
  try {
    /* 读剪贴板要权限，且可能既不成功也不报错——设上限，别把按钮按死。 */
    const t = await Promise.race([
      navigator.clipboard.readText(),
      new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 600)),
    ]);
    if (!t) { $('#paste').focus(); msg('The clipboard is empty; paste it manually.', ''); return; }
    $('#paste').value = t;
    msg('Pasted above; click “Load”.', '');
  } catch {
    $('#paste').focus();
    msg('This browser will not let the page read the clipboard; press Ctrl+V in the box above.', '');
  }
});

$('#load').addEventListener('click', async () => {
  try { await use(parseBackup($('#paste').value)); }
  catch (e) { msg('This cannot be used:' + esc(e.message || e), 'bad'); }
});

$('#restore').addEventListener('click', () => {
  if (!cur || !cur.pkcs8 || !cur.pub) return;
  try {
    store.set(KEY_STORE, JSON.stringify({
      party: cur.party, pkcs8: cur.pkcs8, pub: cur.pub, made: cur.made || new Date().toISOString(),
    }));
    msg('Restored: this browser can now post, withdraw and confirm under this id.', 'ok');
    $('#restore').hidden = true;
  } catch {
    msg('This browser will not let the page write local storage (private mode?). Cannot restore.', 'bad');
  }
});

/* 演示数据：只在预览里（file:// 或非 drawcommons.org）才有，六种状态各一条，好把每一档的键都点一遍。
   真站一条都不加——假单混进真单是灾难。
   注意不能用「清单空才种」：本机只要留过一条旧演示，清单就永远不空，那几条便只剩那一行，
   看着像列表没做出来。所以每次加载都把 rq_demo 开头的行重铺一遍，其余真实记录原样保留。 */
(function seedDemo() {
  if (!FILE_MODE) return;
  try {
    const day = 86400000;
    const now = Date.now();
    /* 每行按需带三类字段，各档都要在页面上看得见：
       claimer_email —— 认领方留的地址（认领之后才可能有，只有发布方这一侧显示）；
       reminders / last_remind_at —— 认领方催过几次、最近一次催在什么时候；
       rejected —— 发布方拒收过这次交付（不改变状态，单子仍在交付中）。
       3 号催过两次、7 号拒收过、2 号刚认领还没催过、4 号已结——四种形态一次看全。 */
    const demo = [
      { id: 'rq_demo00000001', d: 0, state: 'open' },
      { id: 'rq_demo00000002', d: 1, state: 'claimed', claimer: 'worker-b@example.com' },
      { id: 'rq_demo00000003', d: 13, state: 'delivered', dv: 11, claimer: 'worker-b@example.com',
        reminders: 2, last_remind_at: new Date(now - 30 * 3600000).toISOString() },
      { id: 'rq_demo00000004', d: 4, state: 'closed', dv: 3, claimer: 'worker-b@example.com' },
      { id: 'rq_demo00000005', d: 6, state: 'withdrawn' },
      { id: 'rq_demo00000006', d: 9, state: 'expired' },
      { id: 'rq_demo00000007', d: 3, state: 'delivered', dv: 2, claimer: 'worker-b@example.com', rejected: true },
    ].map((x) => ({
      id: x.id,
      at: new Date(now - x.d * day).toISOString(),
      state: x.state,
      by: '',
      ...(x.dv ? { dv: new Date(now - x.dv * day).toISOString() } : {}),
      ...(x.claimer ? { claimer_email: x.claimer } : {}),
      ...(x.reminders ? { reminders: x.reminders, last_remind_at: x.last_remind_at } : {}),
      ...(x.rejected ? { rejected: true } : {}),
    }));
    const real = loadMine().filter((x) => !/^rq_demo/.test(String(x.id)));
    store.set(MINE_STORE, JSON.stringify(real.concat(demo)));
  } catch { /* 写不进就算了，页面照样能用 */ }
})();

/* 本机已经有钥匙就直接显示，不必先粘一遍；没有钥匙也照样把本机清单列出来。 */
(async function boot() {
  let mine = null;
  try { mine = JSON.parse(store.get(KEY_STORE) || 'null'); } catch { /* 坏钥匙当没有 */ }
  if (mine && mine.party) await use(mine);
  else await renderList();
})();

</script>
